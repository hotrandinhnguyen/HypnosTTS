<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HypnosTTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2.5'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="layout">

    <!-- ── Sidebar ─────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <span class="brand-name">HypnosTTS</span>
      </div>

      <div class="sidebar-label" id="sidebar-history-label">Lịch sử</div>
      <ul id="history-list" class="history-list"></ul>
    </aside>

    <!-- ── Main ───────────────────────────────────────────────── -->
    <main class="main">

      <!-- Header + Tabs -->
      <header class="page-header">
        <div class="header-text">
          <h1 class="page-title">Hypnos<span class="title-accent">TTS</span></h1>
          <p class="page-subtitle">AI học tập · Đọc truyện · Giọng cloned nhất quán</p>
        </div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="learn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            Học
          </button>
          <button class="tab-btn" data-tab="story">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Truyện
          </button>
        </div>
      </header>

      <!-- Voice selector (dùng chung) -->
      <div class="voice-section">
        <span class="section-label">Giọng đọc</span>
        <div id="voice-picker" class="voice-picker"></div>
      </div>

      <!-- ── Tab: Học ─────────────────────────────────────────── -->
      <div id="tab-learn" class="tab-content">
        <div class="input-row">
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="topic-input" type="text"
              placeholder="Nhập chủ đề muốn học (VD: Deep Learning, Docker, React hooks...)"
              autocomplete="off" />
          </div>
          <button id="start-btn" class="btn btn-primary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
            Bắt đầu
          </button>
          <button id="stop-btn" class="btn btn-danger hidden">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            Dừng
          </button>
        </div>
      </div>

      <!-- ── Tab: Truyện ──────────────────────────────────────── -->
      <div id="tab-story" class="tab-content hidden">

        <!-- Search row -->
        <div class="input-row">
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="story-search-input" type="text"
              placeholder="Tìm tên truyện (VD: Vạn Cổ Chí Tôn, Đấu Phá Thương Khung...)"
              autocomplete="off" />
          </div>
          <button id="story-search-btn" class="btn btn-primary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            Tìm
          </button>
          <button id="story-stop-btn" class="btn btn-danger hidden">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            Dừng
          </button>
        </div>

        <!-- Search results -->
        <div id="story-results" class="story-results hidden"></div>

        <!-- Chapter picker (shown after selecting a result) -->
        <div id="chapter-picker" class="chapter-picker hidden">
          <div class="chapter-read-row">
            <div id="selected-story-name" class="selected-story-label"></div>
            <div class="chapter-num-group">
              <span class="ctrl-label">Chương</span>
              <input id="chapter-num-input" type="number" min="1" value="1" class="chapter-num-input" />
            </div>
            <button id="story-start-btn" class="btn btn-primary">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
              Đọc
            </button>
          </div>
        </div>

        <!-- Chapter nav (shown while reading) -->
        <div id="chapter-nav" class="chapter-nav hidden">
          <button id="prev-chapter-btn" class="btn btn-ghost" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Chương trước
          </button>
          <span id="chapter-title-display" class="chapter-title-display"></span>
          <button id="next-chapter-btn" class="btn btn-ghost" disabled>
            Chương sau
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

      </div>

      <!-- Status (dùng chung) -->
      <div id="status-bar" class="status-bar hidden">
        <div class="status-waves">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span id="status-text"></span>
      </div>

      <!-- Player card (dùng chung) -->
      <section class="player-card">
        <div class="card-glow"></div>
        <div class="card-header">
          <div class="card-title-group">
            <div class="card-dot"></div>
            <span class="card-title">Nội dung</span>
          </div>
          <button id="download-btn" class="btn btn-ghost hidden">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Tải xuống
          </button>
        </div>

        <div id="caption" class="caption">
          <span class="caption-placeholder">Nội dung sẽ xuất hiện ở đây...</span>
        </div>

        <div id="progress-container" class="progress-container hidden">
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill">
              <div class="progress-shimmer"></div>
            </div>
          </div>
          <span id="progress-label" class="progress-label">0 / 0</span>
        </div>

        <div id="controls" class="controls hidden">
          <button id="pause-btn" class="btn btn-secondary">
            <svg id="pause-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
            <span id="pause-label">Tạm dừng</span>
          </button>
          <div class="ctrl-divider"></div>
          <div class="ctrl-group">
            <span class="ctrl-label">Tốc độ</span>
            <div class="speed-buttons">
              <button class="speed-btn" data-speed="0.75">0.75×</button>
              <button class="speed-btn active" data-speed="1">1×</button>
              <button class="speed-btn" data-speed="1.25">1.25×</button>
              <button class="speed-btn" data-speed="1.5">1.5×</button>
            </div>
          </div>
          <div class="ctrl-divider"></div>
          <div class="ctrl-group">
            <span class="ctrl-label">Âm lượng</span>
            <div class="volume-row">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" />
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
